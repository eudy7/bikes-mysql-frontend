<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Consumo de REST–API de Bicicletas</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="callrestapi.js" defer></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f8;
      padding: 40px;
      max-width: 900px;
      margin: auto;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
    }
    form {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin: 10px 0 5px;
    }
    input[type="text"], input[type="number"], input[type="file"], textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      margin-top: 15px;
      padding: 10px 20px;
      border: none;
      background-color: #3498db;
      color: white;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      margin-right: 10px;
    }
    button:hover {
      background-color: #2980b9;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }
    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }
    th {
      background-color: #f9f9f9;
    }
    img {
      max-width: 100px;
    }
  </style>
</head>
<body>
  <h1>Consumo de REST–API de Bicicletas</h1>

  <form id="bikeForm" enctype="multipart/form-data">
    <label for="brand">Brand</label>
    <input type="text" id="brand" name="brand" required>

    <label for="model">Model</label>
    <input type="text" id="model" name="model" required>

    <label for="price">Price</label>
    <input type="number" id="price" name="price" required>

    <label for="description">Description</label>
    <textarea id="description" name="description" rows="3"></textarea>

    <label for="image">Image</label>
    <input type="file" id="image" name="image" accept="image/*">

    <button type="submit">POST bicicleta</button>
  </form>

  <div style="margin-bottom: 30px;">
    <button id="getBikesBtn" type="button">GET bicicletas</button>
  </div>

  <!-- Aquí se carga la tabla dinámica con acciones -->
  <div id="resultado"></div>
</body>
</html>
