<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Consumo de REST–API de Bicicletas</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="callrestapi.js" defer></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f8;
      padding: 40px;
      max-width: 1100px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #111;
    }

    form, #editModal {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin: 10px 0 5px;
    }

    input[type="text"], input[type="number"], input[type="file"], textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      border: none;
      background-color: #000;
      color: white;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      margin-right: 10px;
    }

    button:hover {
      background-color: #333;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      overflow: hidden;
      transition: transform 0.2s ease;
      padding: 16px;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card img {
      width: 100%;
      height: auto;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .card h3 {
      margin: 0 0 5px;
      font-size: 1.2em;
      color: #000;
    }

    .card p {
      margin: 4px 0;
      font-size: 0.9em;
      color: #333;
    }

    .card .actions {
      margin-top: 12px;
    }

    .card .actions button {
      background-color: #000;
      color: white;
      border: none;
      padding: 6px 12px;
      margin-right: 6px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .card .actions button:hover {
      background-color: #444;
    }

    #editModal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      width: 90%;
      max-width: 500px;
    }

    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0,0,0,0.5);
      z-index: 5;
      display: none;
    }
  </style>
</head>
<body>
  <h1>Consumo de REST–API de Bicicletas</h1>

  <form id="bikeForm" enctype="multipart/form-data">
    <label for="brand">Brand</label>
    <input type="text" id="brand" name="brand" required>

    <label for="model">Model</label>
    <input type="text" id="model" name="model" required>

    <label for="price">Price</label>
    <input type="number" id="price" name="price" required>

    <label for="description">Description</label>
    <textarea id="description" name="description" rows="3"></textarea>

    <label for="image">Image</label>
    <input type="file" id="image" name="image" accept="image/*">

    <button type="submit">POST bicicleta</button>
  </form>

  <div style="margin-bottom: 30px;">
    <button id="getBikesBtn" type="button">GET bicicletas</button>
  </div>

  <div id="resultado"></div>

  <!-- Modal y overlay -->
  <div id="overlay"></div>
  <div id="editModal">
    <h3>Editar Bicicleta</h3>
    <form id="editForm">
      <input type="hidden" id="editId">
      <label>Brand</label>
      <input type="text" id="editBrand">
      <label>Model</label>
      <input type="text" id="editModel">
      <label>Price</label>
      <input type="number" id="editPrice">
      <label>Description</label>
      <textarea id="editDescription"></textarea>
      <div style="margin-top: 15px;">
        <button type="submit">Guardar</button>
        <button type="button" onclick="closeModal()">Cancelar</button>
      </div>
    </form>
  </div>
</body>
</html>
