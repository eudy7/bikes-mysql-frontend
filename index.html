<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Consumo de REST–API de Bicicletas</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="callrestapi.js" defer></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Consumo de REST–API de Bicicletas</h1>

  <form id="bikeForm" enctype="multipart/form-data">
    <label for="brand">Brand</label>
    <input type="text" id="brand" name="brand" required>

    <label for="model">Model</label>
    <input type="text" id="model" name="model" required>

    <label for="price">Price</label>
    <input type="number" id="price" name="price" required>

    <label for="description">Description</label>
    <textarea id="description" name="description" rows="3"></textarea>

    <label for="image">Image</label>
    <input type="file" id="image" name="image" accept="image/*">

    <button type="submit">POST bicicleta</button>
  </form>

  <div style="margin-bottom: 30px;">
    <button id="getBikesBtn" type="button">GET bicicletas</button>
  </div>

  <div id="resultado"></div>

  <div id="overlay"></div>
  <div id="editModal">
    <h3>Editar Bicicleta</h3>
    <form id="editForm">
      <input type="hidden" id="editId">
      <label>Brand</label>
      <input type="text" id="editBrand">
      <label>Model</label>
      <input type="text" id="editModel">
      <label>Price</label>
      <input type="number" id="editPrice">
      <label>Description</label>
      <textarea id="editDescription"></textarea>
      <div style="margin-top: 15px;">
        <button type="submit">Guardar</button>
        <button type="button" onclick="closeModal()">Cancelar</button>
      </div>
    </form>
  </div>
</body>
</html>
